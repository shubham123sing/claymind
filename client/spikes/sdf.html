<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />

    <title>ClayMind spike: SDF sculpt</title>
    <style>
      body { margin: 0; background: #1d1f24; color: #e8e8ea; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }

      button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 0; background: #e2733b; color: #fff; cursor: pointer; }
      button.alt { background: #3a3f4a; }
    </style>
  </head>
  <body>
    <div id="hud">loading…</div>
    <div id="btns">
      <button id="bench">Run benchmark (400 strokes)</button>
      <button class="alt" id="res48">48³</button>
      <button class="alt" id="res64">64³</button>
      <button class="alt" id="reset">Reset clay</button>

    <script type="module" src="../src/spikes/sdf-page.ts"></script>
