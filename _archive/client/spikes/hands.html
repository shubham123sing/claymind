<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClayMind spike: webcam hands</title>
    <style>
      body { margin: 0; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; }
      #wrap { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
      video, canvas { position: absolute; max-width: 100vw; max-height: 100vh; transform: scaleX(-1); }
      #hud { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.65); padding: 10px 12px; border-radius: 10px; white-space: pre; font-family: ui-monospace, monospace; z-index: 2; }
      #start { position: fixed; bottom: 16px; left: 16px; z-index: 2; font: inherit; padding: 12px 16px; border-radius: 10px; border: 0; background: #e2733b; color: #fff; }
    </style>
  </head>
  <body>
    <div id="wrap"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
    <div id="hud">Press "Start camera". Model + wasm load locally except the hand model file.</div>
    <button id="start">Start camera</button>
    <script type="module" src="../src/spikes/hands-page.ts"></script>
  </body>
</html>
